name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore OllamaAgent.sln

      - name: Build
        run: dotnet build OllamaAgent.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          dotnet publish src/OllamaAgent/OllamaAgent.csproj -c Release -o publish -r win-x64 --self-contained false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: OllamaAgent-win-x64
          path: publish/
          retention-days: 7
